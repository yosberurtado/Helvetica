<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>Casa Cuco</title>
<meta name="description" content="Casa Cuco. Creamos soluciones integrales para ideas y desafíos únicos.">
<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Inter:wght@400;500;600;700&family=Labrada:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>

<!-- Marca oficial vectorizada desde el logo de casacuco.cl -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cuco" viewBox="38 93 949 806"><path fill="currentColor" fill-rule="evenodd" d="M40 411L40 897L433 896L483 856L547 895L592 793L683 895L759 850L984 894L968 438L865 380L731 162L638 257L342 95Z M331 365L422 363L470 431L398 434L355 479L349 521L403 560L462 550L478 543L475 554L406 626L315 611L274 583L253 500L282 398Z M678 435L714 467L727 530L694 588L669 610L627 608L584 565L583 524L585 522L620 551L653 550L668 541L672 508L658 486L640 477L604 472L609 462Z"/></symbol>
  <symbol id="cuco-luna" viewBox="227 40 573 485"><path fill="currentColor" d="M229 283L229 522L422 522L446 503L479 521L501 472L546 521L584 499L694 521L686 296L635 267L570 161L523 207L377 128Z M741 42L666 72L659 82L659 85L700 89L719 98L736 125L732 163L714 174L675 175L638 144L634 144L635 190L682 238L733 240L759 217L797 150L782 78Z"/></symbol>
</svg>

<canvas id="world" aria-label="Casa Cuco en 3D"></canvas>
<div id="css-layer"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#" data-go="exterior" aria-label="Casa Cuco, volver al exterior">
    <img src="assets/brand/logo-casa-cuco.png" alt="Casa Cuco" width="900" height="410">
  </a>
  <nav class="nav" id="nav" aria-label="Secciones">
    <button type="button" data-go="exterior">Exterior</button>
    <button type="button" data-go="inicio">Inicio</button>
    <button type="button" data-go="nosotros">Nosotros</button>
    <button type="button" data-go="proyectos">Proyectos</button>
    <button type="button" data-go="servicios">Servicios</button>
    <button type="button" data-go="contacto">Contacto</button>
  </nav>
  <div class="top-actions">
    <button type="button" class="btn-solid talk" data-go="contacto">Conversemos</button>
    <button type="button" class="icon-btn" id="fsBtn" aria-label="Pantalla completa" title="Pantalla completa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button type="button" class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menú</button>
  </div>
</header>

<!-- Interfaz del exterior -->
<section class="ext-ui" id="extUI">
  <div class="caption">
    <p class="eyebrow">Casa Cuco</p>
    <h1>Pase,<br><span class="acid">sin miedo.</span></h1>
    <div class="ext-actions">
      <button type="button" class="btn-solid" id="enterBtn">Entrar a la casa</button>
      <button type="button" class="btn-ghost" id="orbitBtn">Órbita 360°</button>
    </div>
  </div>
  <p class="hint" id="extHint"><b>Arrastra</b> girar · <b>Rueda</b> acercar · <b>Clic en la puerta</b> entrar</p>
</section>

<!-- Interfaz del interior -->
<section class="int-ui" id="intUI" hidden>
  <div class="room-bar">
    <p class="eyebrow" id="roomLabel">Inicio</p>
    <button type="button" class="btn-ghost" id="exitBtn">Salir al exterior</button>
  </div>
  <div class="map-box">
    <canvas id="minimap" width="240" height="64" aria-label="Plano de la casa. Toca una sala para ir."></canvas>
    <p class="hint" id="intHint"><b>W A S D</b> caminar · <b>Arrastra</b> mirar · <b>Clic en el piso</b> ir ahí · <b>1–5</b> salas</p>
  </div>
  <div class="joy" id="joy" aria-hidden="true"><div class="joy-knob" id="joyKnob"></div></div>
</section>

<div class="fade" id="fade" aria-hidden="true"></div>
<div class="loading" id="loading"><svg class="loading-mark" aria-hidden="true"><use href="#cuco"/></svg></div>

<!--
  SECCIONES · Contenido oficial de casacuco.cl. Cada <template> se proyecta como holograma en su sala
  (formato horizontal en PC, vertical en móvil).
-->
<template id="tpl-inicio">
  <div class="holo-in hero">
    <div class="hero-grid">
      <div class="hero-copy">
        <h2 class="display">Creamos soluciones integrales para ideas y desafíos únicos.</h2>
        <h2 class="display acid">experiencias que conectan con la audiencia.</h2>
        <a class="btn-outline" href="#contacto" data-go="contacto">Cuéntanos tu idea</a>
      </div>
      <img class="hero-mark" src="assets/brand/casa-luna.png" alt="" width="571" height="482">
    </div>
    <div class="looking">
      <p class="kicker">¿Me estabas buscando?</p>
      <ul class="dots">
        <li>Comunicación estratégica</li>
        <li>Relatos y personajes</li>
        <li>Contenidos audiovisuales</li>
        <li>Plataformas de contenido</li>
      </ul>
    </div>
  </div>
</template>

<template id="tpl-nosotros">
  <div class="holo-in">
    <p class="slash">/ Nosotros /</p>
    <div class="about-grid">
      <figure class="about-art"><svg aria-hidden="true"><use href="#cuco"/></svg></figure>
      <div class="about-copy">
        <h3 class="display">Creatividad sin miedo</h3>
        <p>Es hora de crear nuevas leyendas y desmitificar lo incorrecto.</p>
        <p>No buscamos presencia, buscamos permanencia. Queremos que tu caso inspire y se convierta en una experiencia que la gente quiera volver a vivir.</p>
        <p>Trabajamos como comunicadores, diseñadores y narradores, integrando comunicación estratégica, metodologías ágiles, pensamiento de diseño y relato.</p>
        <a class="btn-bar" href="#contacto" data-go="contacto">Conversar con nosotros</a>
      </div>
    </div>
  </div>
</template>

<template id="tpl-proyectos">
  <div class="holo-in">
    <div class="sec-head">
      <div><p class="slash">/ Proyectos /</p><h2 class="display small">Trabajos que dejan huella</h2></div>
      <a class="link-more" href="https://casacuco.cl/proyectos/" target="_blank" rel="noopener">Ver más</a>
    </div>
    <div class="projects">
      <article class="project"><img src="assets/proyectos/de-todo-chile.jpg" alt="De Todo Chile" width="500" height="700"><h4>De Todo Chile</h4><p>Plataforma web + narrativa</p></article>
      <article class="project"><img src="assets/proyectos/bombus-chilensis.jpg" alt="Bombus Chilensis" width="500" height="700"><h4>Bombus Chilensis</h4><p>Personajes + ilustración</p></article>
      <article class="project"><img src="assets/proyectos/olivia-home.jpg" alt="Olivia home" width="500" height="700"><h4>Olivia home</h4><p>Diseño digital + contenido</p></article>
      <article class="project"><img src="assets/proyectos/zappy-y-el-quirincho.jpg" alt="Zappy y El Quirincho" width="500" height="700"><h4>Zappy y El Quirincho</h4><p>Campaña + personajes</p></article>
    </div>
    <div class="marquee" aria-label="Creatividad sin miedo, ideas únicas, conversar con nosotros">
      <div class="marquee-track" aria-hidden="true">
        <span>Creatividad sin miedo</span><i>✦</i><span>Ideas únicas</span><i>✦</i><span>Conversar con nosotros</span><i>✦</i>
        <span>Creatividad sin miedo</span><i>✦</i><span>Ideas únicas</span><i>✦</i><span>Conversar con nosotros</span><i>✦</i>
      </div>
    </div>
  </div>
</template>

<template id="tpl-servicios">
  <div class="holo-in">
    <p class="slash">/ Servicios /</p>
    <h2 class="display small">De la idea a la experiencia</h2>
    <div class="services">
      <article class="service">
        <div class="service-img"><span class="badge">01</span><img src="assets/servicios/estrategia-y-creatividad.jpg" alt="" width="768" height="724"></div>
        <h3>Estrategia y creatividad</h3>
        <p>Transformamos desafíos únicos en conceptos, identidades y soluciones creativas.</p>
        <a href="#contacto" data-go="contacto">Conversar con nosotros</a>
      </article>
      <article class="service">
        <div class="service-img"><span class="badge">02</span><img src="assets/servicios/relatos-y-personajes.jpg" alt="" width="768" height="491"></div>
        <h3>Relatos y personajes</h3>
        <p>Creamos historias y personajes capaces de conectar, enseñar y permanecer.</p>
        <a href="#contacto" data-go="contacto">Conversar con nosotros</a>
      </article>
      <article class="service">
        <div class="service-img"><span class="badge">03</span><img src="assets/servicios/contenidos-audiovisuales.jpg" alt="" width="768" height="488"></div>
        <h3>Contenidos audiovisuales</h3>
        <p>Desarrollamos series animadas, documentales, videos corporativos y pódcast.</p>
        <a href="#contacto" data-go="contacto">Conversar con nosotros</a>
      </article>
      <article class="service">
        <div class="service-img"><span class="badge">04</span><img src="assets/servicios/plataformas-y-publicaciones.jpg" alt="" width="768" height="438"></div>
        <h3>Plataformas y publicaciones</h3>
        <p>Creamos plataformas de contenido, libros y revistas en formatos digitales o físicos.</p>
        <a href="#contacto" data-go="contacto">Conversar con nosotros</a>
      </article>
    </div>
  </div>
</template>

<template id="tpl-contacto">
  <div class="holo-in">
    <div class="contact-grid">
      <div class="contact-main">
        <p class="slash">/ Contacto /</p>
        <h2 class="display small">Cuéntanos tu idea</h2>
        <p>¿Tienes una idea, un desafío o una historia que quieres llevar más lejos?</p>
        <p>Para desafíos únicos, creamos soluciones integrales que te devuelven al lugar donde nace tu curiosidad.</p>
        <p><b>Pase, sin miedo. Queremos conocer tu proyecto.</b></p>
        <form class="contact-form" novalidate>
          <input name="name" placeholder="NOMBRE" autocomplete="name" aria-label="Nombre" required>
          <input name="email" type="email" placeholder="CORREO" autocomplete="email" aria-label="Correo" required>
          <textarea name="message" rows="3" placeholder="MENSAJE" aria-label="Mensaje" required></textarea>
          <button type="submit" class="btn-solid">Enviar</button>
          <p class="form-status" aria-live="polite"></p>
        </form>
      </div>
      <div class="contact-side">
        <img class="hands" src="assets/brand/manos.png" alt="" width="414" height="171">
        <div class="contact-block">
          <h6>Contacto directo</h6>
          <p class="who">Fernando Muñoz G.</p>
          <p class="mono">fernando@grupokeipoint.com</p>
          <p class="mono">+56 9 3393 8347</p>
        </div>
        <div class="contact-cols">
          <div>
            <h6>Menú</h6>
            <p class="menu-links"><a href="#nosotros" data-go="nosotros">Nosotros</a><a href="#proyectos" data-go="proyectos">Proyectos</a><a href="#servicios" data-go="servicios">Servicios</a><a href="#contacto" data-go="contacto">Contacto</a></p>
          </div>
          <div>
            <h6>Grupo Keipoint</h6>
            <p><a href="https://grupokeipoint.com/" target="_blank" rel="noopener">Agencia Keipoint</a></p>
            <h6>Contacto</h6>
            <p class="mono">contacto@grupokeipoint.com</p>
          </div>
        </div>
      </div>
    </div>
    <div class="holo-foot">
      <img src="assets/brand/logo-casa-cuco.png" alt="Casa Cuco" width="900" height="410">
      <p>© 2026 | Casa Cuco · Todos los derechos reservados</p>
      <p><a href="https://grupokeipoint.com/" target="_blank" rel="noopener">Desarrollado por Grupo Keipoint</a></p>
    </div>
  </div>
</template>

<script type="module" src="js/main.js"></script>
</body>
</html>
